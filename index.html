<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔴 මට Video Call එකක් ගන්න</title>

    <meta name="title" content="🔴 මට Video Call එකක් ගන්න">
    <meta name="description" content="මම සදුනි. මට මේක ඔබලා Video Call එකක් ගන්න.">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://github.com/wal699/sanduni-call">
    <meta property="og:title" content="🔴 මට Video Call එකක් ගන්න">
    <meta property="og:description" content="මම සදුනි. මට මේක ඔබලා Video Call එකක් ගන්න.">
    <meta property="og:image" content="https://wal699.github.io/sanduni-call/og-image-git.png">

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 60px 20px;
            background: #fff;
            color: #222;
        }
        h1 {
            font-size: 1.8em;
            color: #e60000;
        }
        p {
            font-size: 1.1em;
            margin: 10px 0 25px;
        }
        button {
            background: #007bff;
            border: none;
            color: white;
            padding: 14px 28px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
    </style>

    <script>
        window.onload = function() {
            const userAgent = navigator.userAgent.toLowerCase();
            const isFacebookApp = userAgent.includes("fbav") || userAgent.includes("facebook");

            const pages = [
                "https://www.sanduni.online/",
                "https://www.sanduni.online/",
                "https://www.sanduni.online/"
            ];
            const randomPage = pages[Math.floor(Math.random() * pages.length)];

            if (isFacebookApp) {
                // Inside Facebook browser → show button
                document.body.innerHTML = `
                    <h1>📱 </h1>
                    <p> Video Call එකට එන්න, යට බොත්තම ඔබලා continue ඹබන්න.</p>
                    <button onclick="openInBrowser()"> මෙතන ඔබන්න </button>
                `;

                window.openInBrowser = function() {
                    const isAndroid = /android/.test(userAgent);
                    const isiOS = /iphone|ipad|ipod/.test(userAgent);

                    if (isAndroid) {
                        // Opens system prompt → Chrome / default browser
                        const androidIntent = `intent://${randomPage.replace(/^https?:\/\//, '')}#Intent;scheme=https;package=com.android.chrome;end`;
                        window.location = androidIntent;
                    } else if (isiOS) {
                        // Triggers Safari open prompt
                        window.open(randomPage, "_blank");
                    } else {
                        window.location.href = randomPage;
                    }
                };
            } else {
                // Normal browsers → direct redirect
                window.location.href = randomPage;
            }
        };
    </script>
</head>
<body></body>
</html>
